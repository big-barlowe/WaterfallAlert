name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waterfall_alert/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build add-on image
        working-directory: waterfall_alert
        run: docker build -t waterfall-alert:ci .

  # Standalone Docker image on ghcr.io (the Home Assistant add-on still builds
  # locally from the Dockerfile). Every push to main updates :edge; when the
  # version in package.json has no image yet, it is also published as
  # :<version>, :<major.minor> and :latest. So releasing = bumping the
  # version, as for the add-on.
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/waterfall-alert
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this a new version?
        id: version
        run: |
          IMAGE="${IMAGE,,}"
          VERSION=$(jq -r .version waterfall_alert/app/package.json)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION already exists; only updating :edge"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $IMAGE:$VERSION"
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=edge
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.release }}
            type=raw,value=latest,enable=${{ steps.version.outputs.release }}
          labels: |
            org.opencontainers.image.title=Upstream Kuma
            org.opencontainers.image.description=Hierarchical uptime monitoring with root-cause alerting
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: waterfall_alert
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
