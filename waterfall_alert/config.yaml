name: Waterfall Alert
version: "0.6.1"
slug: waterfall_alert
description: Hierarchical uptime monitoring — one alert for the root cause, not twenty.
url: https://github.com/big-barlowe/WaterfallAlert
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:waterfall
panel_title: Waterfall
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Push monitor endpoint / direct web UI (optional)
options:
  log_level: info
  allow_direct_access: false
schema:
  log_level: list(debug|info|warning|error)
  allow_direct_access: bool
