# Waterfall Alert without Home Assistant. Full guide: docs/docker.md
#
#   docker compose up -d --build
#
# then open http://<this-machine>:8099. There is no login, so keep it on a
# trusted network or behind a reverse proxy that adds one (see the guide).
services:
  waterfall-alert:
    # Builds from this checkout. To build straight from GitHub without
    # cloning, use this line instead:
    # build: https://github.com/big-barlowe/WaterfallAlert.git#main:waterfall_alert
    build: ./waterfall_alert
    image: waterfall-alert:local
    container_name: waterfall-alert
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      # The SQLite database lives here; back up this folder.
      - ./data:/data
    environment:
      # Time zone for timestamps in alert messages and logs.
      TZ: Etc/UTC
      # debug, info, warning or error
      LOG_LEVEL: info
      # Optional: connect to Home Assistant for "HA entity" monitors and the
      # Home Assistant notification channel. HA_TOKEN is a long-lived access
      # token (your HA profile -> Security).
      # HA_URL: http://homeassistant.local:8123
      # HA_TOKEN: eyJhbGciOi...
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8099/api/info"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
